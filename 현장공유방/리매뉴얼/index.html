const bps = [{"id":"bp_1793665972159","name":"여의도진주 _지하7층","fileName":"bp_bp_1793665972159.png","src":"photos/bp_bp_1793665972159.png","lat":37.51817546636485,"lng":126.93295925885623,"swLat":37.51684095000422,"swLng":126.93127672816345,"neLat":37.51950998272548,"neLng":126.934641789549,"rotation":-37.949692533221366,"opacity":1.0,"origOpacity":0.5,"baseRadius":148.5583612654448,"sizeSlider":0.5,"isVisible":true},{"id":"bp_1793665972160","name":"여의도진주_배치도","fileName":"bp_bp_1793665972160.png","src":"photos/bp_bp_1793665972160.png","lat":37.51818968651289,"lng":126.9329522120748,"swLat":37.51688076756059,"swLng":126.93130195375183,"neLat":37.51949860546519,"neLng":126.93460247039776,"rotation":-37.64985087837745,"opacity":1.0,"origOpacity":0.5,"baseRadius":124.58015630986287,"sizeSlider":0.5712995717523941,"isVisible":false},{"id":"bp_1793665972161","name":"본사9층","fileName":"bp_bp_1793665972161.png","src":"photos/bp_bp_1793665972161.png","lat":37.56149880879525,"lng":126.82622542861358,"swLat":37.56099397765897,"swLng":126.82558857800574,"neLat":37.56200363993153,"neLng":126.82686227922143,"rotation":96.87347983983318,"opacity":1.0,"origOpacity":0.5,"baseRadius":33.4630718217425,"sizeSlider":0.735950005130815,"isVisible":false},{"id":"bp_1793881371872","name":"도면 4","fileName":"bp_bp_1793881371872.png","src":"photos/bp_bp_1793881371872.png","lat":37.617432879221695,"lng":126.92514181283944,"swLat":37.61230644727166,"swLng":126.91866989477305,"neLat":37.62255931117173,"neLng":126.93161373090584,"rotation":1.7731732319913363,"opacity":1.0,"origOpacity":0.5,"baseRadius":214.28561170366032,"sizeSlider":0.9457937883659625,"isVisible":true}];
let filteredPhotos = photos.slice();
let selectedIdx = 0;

function resolvePhotoSrc(p) {
 if (p.b64 && p.b64.length > 20) return p.b64;
 if (p.src && p.src.length > 0) return p.src;
 if (p.fileName) return 'photos/' + p.fileName;
 return '';
}
function resolveAfterSrc(p) {
 if (p.afterB64 && p.afterB64.length > 20) return p.afterB64;
 if (p.afterSrc && p.afterSrc.length > 0) return p.afterSrc;
 if (p.afterFileName && p.afterFileName.length > 0) return 'photos/' + p.afterFileName;
 return '';
}
function resolveBpSrc(bp) {
 if (bp.b64 && bp.b64.length > 20) return bp.b64;
 if (bp.src && bp.src.length > 0) return bp.src;
 if (bp.fileName) return 'photos/' + bp.fileName;
 return '';
}

(function initFilters() {
 const catSel = document.getElementById('cat-filter');
 const authSel = document.getElementById('author-filter');
 const cats = Array.from(new Set(photos.map(p => p.category || '미분류')));
 catSel.innerHTML = '<option value="ALL">전체 카테고리 (' + photos.length + ')</option>' +
  cats.map(c => '<option value="' + c + '">' + c + ' (' + photos.filter(p => (p.category || '미분류') === c).length + ')</option>').join('');
 const authors = Array.from(new Set(photos.map(p => p.author || '').filter(Boolean)));
 authSel.innerHTML = '<option value="ALL">전체 작성자</option>' +
  authors.map(a => '<option value="' + a + '">작성자: ' + a + '</option>').join('');
})();

function onFilterChange() {
 const c = document.getElementById('cat-filter').value;
 const a = document.getElementById('author-filter').value;
 filteredPhotos = photos.filter(p => {
  const mc = (c === 'ALL') || ((p.category || '미분류') === c);
  const ma = (a === 'ALL') || ((p.author || '') === a);
  return mc && ma;
 });
 selectedIdx = 0;
 if (filteredPhotos.length > 0) {
  selectPhoto(0);
 } else {
  document.getElementById('main-photo').src = '';
  document.getElementById('after-pane').style.display = 'none';
  document.getElementById('thumbs').innerHTML = '';
  markersLayer.clearLayers();
  document.getElementById('info-txt').innerText = '선택한 조건의 사진이 없습니다.';
 }
}

const initLat = photos.length > 0 ? photos[0].lat : (bps.length > 0 ? bps[0].lat : 37.4984);
const initLng = photos.length > 0 ? photos[0].lng : (bps.length > 0 ? bps[0].lng : 127.1324);
const map = L.map('map-pane', { maxZoom: 22 }).setView([initLat, initLng], 16.7);
L.tileLayer('https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 22, attribution: '© VWorld' }).addTo(map);

bps.forEach((bp) => {
 if (bp.isVisible === false) return;
 const bpImg = new Image();
 bpImg.crossOrigin = 'anonymous';
 bpImg.onload = () => {
  const size = 900, pad = 40, inner = size - pad * 2;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.translate(size / 2, size / 2);
  ctx.rotate((bp.rotation || 0) * Math.PI / 180.0);
  const scale = Math.min(inner / bpImg.width, inner / bpImg.height);
  ctx.drawImage(bpImg, -(bpImg.width * scale) / 2, -(bpImg.height * scale) / 2, bpImg.width * scale, bpImg.height * scale);
  ctx.restore();
  const bounds = [[bp.swLat, bp.swLng], [bp.neLat, bp.neLng]];
  L.imageOverlay(canvas.toDataURL('image/png'), bounds, { opacity: bp.origOpacity || 0.65, interactive: false }).addTo(map);
 };
 bpImg.src = resolveBpSrc(bp);
});

const markersLayer = L.layerGroup().addTo(map);
function selectPhoto(idx, shouldPan = true) {
 if (idx < 0 || idx >= filteredPhotos.length) return;
 selectedIdx = idx;
 const p = filteredPhotos[idx];
 document.getElementById('main-photo').src = resolvePhotoSrc(p);
 const afterUrl = resolveAfterSrc(p);
 const afterPane = document.getElementById('after-pane');
 const beforeBadge = document.getElementById('before-badge');
 const photosWrapEl = document.getElementById('photos-wrap');
 if (afterUrl.length > 0) {
  document.getElementById('after-photo').src = afterUrl;
  afterPane.style.display = 'flex';
  beforeBadge.style.display = 'block';
  if (photosWrapEl) photosWrapEl.style.flex = '0 0 66.6%';
 } else {
  afterPane.style.display = 'none';
  beforeBadge.style.display = 'none';
  if (photosWrapEl) photosWrapEl.style.flex = '0 0 50%';
 }
 setTimeout(() => map.invalidateSize(), 60);
 const authorTag = (p.author && p.author.trim().length > 0) ? (' · 👷 ' + p.author.trim()) : '';
 const memoClean = (p.memo && p.memo.trim().length > 0) ? (' — ' + p.memo.trim()) : '';
 document.getElementById('info-txt').innerText = '[' + (p.category || '미분류') + authorTag + '] (' + (p.time || '') + ')' + memoClean;
 renderThumbnails();
 renderMarkers();
 if (shouldPan) map.panTo([p.lat, p.lng]);
}
function renderThumbnails() {
 const box = document.getElementById('thumbs');
 box.innerHTML = '';
 filteredPhotos.forEach((p, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'thumb-wrap';
  const im = document.createElement('img');
  im.src = resolvePhotoSrc(p);
  if (i === selectedIdx) im.className = 'active';
  im.onclick = () => selectPhoto(i, true);
  wrap.appendChild(im);
  if (resolveAfterSrc(p).length > 0) {
   const tag = document.createElement('span');
   tag.className = 'thumb-tag';
   tag.innerText = '조치후';
   wrap.appendChild(tag);
  }
  box.appendChild(wrap);
 });
}
function renderMarkers() {
 markersLayer.clearLayers();
 filteredPhotos.forEach((p, i) => {
  const isSel = (i === selectedIdx);
  const color = isSel ? '#2979ff' : '#f44336';
  const noDir = (p.azimuth === undefined || p.azimuth < 0);
  const htmlIcon = L.divIcon({
   className: '',
   iconSize: [28, 28],
   iconAnchor: [14, 14],
   html: '<div style="width:24px;height:24px;border-radius:50%;background:' + color + '4d;border:2px solid ' + color + ';display:flex;align-items:center;justify-content:center;' + (noDir ? '' : 'transform:rotate(' + p.azimuth + 'deg);') + '"><span style="color:' + color + ';font-size:' + (noDir ? '12px' : '14px') + ';font-weight:bold;">' + (noDir ? '●' : '▲') + '</span></div>'
  });
  const m = L.marker([p.lat, p.lng], { icon: htmlIcon, zIndexOffset: isSel ? 1000 : 100 }).addTo(markersLayer);
  m.on('click', () => selectPhoto(i, false));
 });
}
if (filteredPhotos.length > 0) selectPhoto(0);
